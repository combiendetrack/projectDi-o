<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT_23</title>
<style>
  :root{
    --bg:#050505; --fg:#e7e7e7; --muted:#6e6e6e; --line:#222;
    --ok:#9b9b9b; --danger:#8a8a8a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Courier New",monospace}
  body{display:flex;align-items:center;justify-content:center;padding:24px}
  .screen{width:min(760px,100%);min-height:640px;display:flex;align-items:center;justify-content:center}
  .panel{width:100%;border:1px solid var(--line);padding:34px 28px;background:#070707;box-shadow:0 0 45px rgba(255,255,255,.02)}
  .top{display:flex;justify-content:space-between;color:#555;font-size:11px;letter-spacing:.12em;margin-bottom:55px}
  h1{font-size:18px;font-weight:400;letter-spacing:.22em;margin:0 0 12px}
  .sub{color:#666;font-size:11px;line-height:1.7;margin-bottom:42px}
  .field{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:center;margin:17px 0}
  label{font-size:12px;color:#777}
  input{width:100%;background:transparent;border:0;border-bottom:1px solid #292929;color:#ddd;padding:9px 2px;font:inherit;outline:none}
  input:focus{border-bottom-color:#777}
  button{font:inherit;color:#cfcfcf;background:#0b0b0b;border:1px solid #2b2b2b;padding:12px 18px;cursor:pointer;letter-spacing:.08em}
  button:hover{background:#111;border-color:#555}
  .action{margin-top:42px;display:flex;justify-content:flex-end}
  .status{height:20px;margin-top:18px;color:#666;font-size:11px}
  .hidden{display:none!important}
  .center{text-align:center}
  .fade{animation:fade .8s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .divider{height:1px;background:#171717;margin:35px 0}
  .checklist{margin:28px auto;max-width:470px;text-align:left;font-size:12px;line-height:2.2;color:#777}
  .check{float:right;color:#bdbdbd}
  .quote{font-size:14px;line-height:2;color:#aaa;margin:35px 0}
  .wave{height:110px;border:1px solid #202020;position:relative;margin:30px 0;background:repeating-linear-gradient(90deg,#080808 0,#080808 11px,#0d0d0d 12px)}
  .wave:before{content:"";position:absolute;left:6%;right:6%;top:50%;height:1px;background:#292929}
  .bars{position:absolute;inset:22px 6%;display:flex;align-items:center;gap:3px}
  .bars span{width:3px;background:#6b6b6b;display:block;opacity:.65}
  .cut{position:absolute;top:0;bottom:0;left:50%;width:1px;background:#ddd;box-shadow:0 0 12px rgba(255,255,255,.18)}
  .cutmark{position:absolute;left:50%;top:7px;transform:translateX(-50%);font-size:9px;color:#777}
  .hint{color:#666;font-size:10px;line-height:1.7}
  .slots{display:flex;justify-content:center;gap:9px;margin:34px 0;flex-wrap:wrap}
  .slot{width:34px;height:40px;border:1px solid #282828;display:flex;align-items:center;justify-content:center;color:#555;font-size:13px}
  .slot.active{border-color:#777;color:#ddd}
  .answer{margin-top:28px;font-size:22px;letter-spacing:.32em;color:#eee}
  .exclusive{border:1px solid #222;padding:28px;margin-top:32px;text-align:center}
  .exclusive button{margin-top:18px}
  audio{width:100%;filter:grayscale(1);opacity:.75}
  .small{font-size:10px;color:#4f4f4f;margin-top:28px}
  @media(max-width:520px){.panel{padding:25px 18px}.field{grid-template-columns:80px 1fr}.top{margin-bottom:38px}.screen{min-height:560px}}
</style>
</head>
<body>
<main class="screen">
  <section class="panel fade" id="app"></section>
</main>

<script>
const app=document.getElementById('app');

const state={ step:1, unlocked:false };

function renderAccess(){
  app.innerHTML=`
    <div class="top"><span>PROJECT_23</span><span>ACCESS / 01</span></div>
    <h1>COMPLÉTER</h1>
    <div class="sub">si tu es arrivé jusqu'ici,<br>tu devrais déjà avoir les réponses.</div>

    <div class="field"><label>track 01 :</label><input id="t1" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label>track 02 :</label><input id="t2" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label>track 03 :</label><input id="t3" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label>date :</label><input id="date" autocomplete="off" spellcheck="false"></div>

    <div class="action"><button id="go">CONTINUER</button></div>
    <div class="status" id="status"></div>
  `;
  document.getElementById('go').onclick=validate;
  document.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')validate()}));
}

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[’']/g,"'").trim().replace(/\\s+/g,' ')}
function validate(){
  const vals=[norm(t1.value),norm(t2.value),norm(t3.value),norm(date.value)];
  const ok=vals[0]==="merci a vous" && vals[1]==="big deal" && vals[2]==="pluie" && ["23/10","23-10","23.10"].includes(vals[3]);
  const status=document.getElementById('status');
  if(!ok){status.textContent="certaines réponses ne correspondent pas."; return;}
  state.unlocked=true;
  app.classList.remove('fade'); void app.offsetWidth; app.classList.add('fade');
  setTimeout(renderPuzzle,250);
}

function renderPuzzle(){
  app.innerHTML=`
    <div class="top"><span>PROJECT_23</span><span>ACCESS / 02</span></div>
    <div class="center">
      <h1>ACCESS GRANTED</h1>
      <div class="sub">tu as trouvé ce qui était visible.</div>
    </div>
    <div class="divider"></div>
    <div class="quote center">maintenant trouve ce qui était caché.</div>

    <div class="wave" aria-label="forme d'onde">
      <div class="bars" id="bars"></div>
      <div class="cut"></div><div class="cutmark">?</div>
    </div>

    <div class="center hint">la piste est coupée en deux.<br>ce qui manque n'est pas dans le son.</div>

    <div class="slots" id="slots"></div>
    <div class="action"><button id="solve">RÉUNIR</button></div>
    <div class="status center" id="pstatus"></div>
    <div class="small center">indice : ne regarde pas l'ensemble.</div>
  `;
  const bars=document.getElementById('bars');
  for(let i=0;i<105;i++){const s=document.createElement('span');s.style.height=(12+Math.abs(Math.sin(i*.77))*55+Math.random()*20)+'px';bars.appendChild(s)}
  const slots=document.getElementById('slots');
  for(let i=0;i<12;i++){const d=document.createElement('div');d.className='slot';d.textContent='·';slots.appendChild(d)}
  document.getElementById('solve').onclick=solve;
}

function solve(){
  const p=document.getElementById('pstatus');
  p.textContent="...";
  setTimeout(()=>{
    app.innerHTML=`
      <div class="top"><span>PROJECT_23</span><span>ACCESS / FINAL</span></div>
      <div class="center">
        <div class="sub">la dernière pièce.</div>
        <div class="answer">CASSER EN 2</div>
        <div class="divider"></div>
        <div class="sub">tu viens de trouver le quatrième titre.</div>
      </div>

      <div class="exclusive">
        <div style="font-size:12px;letter-spacing:.12em">EXCLU</div>
        <div class="sub" style="margin:12px 0 0">merci d'être allé jusqu'au bout.</div>
        <button id="open">OUVRIR L'EXCLU</button>
        <div id="secret" class="hidden" style="margin-top:22px">
          <div class="divider"></div>
          <div class="hint">PLACEHOLDER — ici viendra ton vrai extrait / message / fichier exclusif.</div>
          <audio controls class="hidden" id="audio"><source src="" type="audio/mpeg"></audio>
        </div>
      </div>
      <div class="small center">23 / 10 · 4 tracks · 1 histoire</div>
    `;
    document.getElementById('open').onclick=()=>{
      document.getElementById('secret').classList.remove('hidden');
      document.getElementById('open').textContent="OUVERT";
      document.getElementById('open').disabled=true;
    };
  },800);
}

renderAccess();
</script>
</body>
</html>
